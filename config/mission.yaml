# Parameters for the on-robot mission (launch/mission.launch.py). Frames match balance_robot_base.
search_mission:
  ros__parameters:
    base_frame: base_footprint
    odom_frame: odom_combined
    auto_start: true          # start search automatically once map, AMCL, Nav2 and perception are ready
    auto_start_delay: 10.0    # s after node start before the first attempt
    set_initial_pose: true    # publish initial_x/y/yaw to AMCL (map origin = where mapping started)
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0
    clearance: 0.12           # m, free distance required around a viewpoint (+ half a cell)
    transit_clearance: 0.10   # m, reachable region; + half a cell = 0.135 > robot radius 0.12. Arena corridor
                              # narrows to ~0.29 m: >= 0.12 cuts the start arm off (1 viewpoint instead of 5)
    max_seed_distance: 1.0
    spacing: 0.9              # m between viewpoints
    headings: 6               # minimum view directions per viewpoint
    heading_overlap: 0.15
    hfov_deg: 93.0            # camera horizontal FOV, from balance_usb_cam camera_info (fx=303.6, width 640)
    dwell: 2.5                # s stationary per heading (YOLO runs at ~3 Hz)
    goal_timeout: 60.0
    mission_timeout: 600.0
    home_tolerance: 0.25
    perception_timeout: 4.0
    report_path: /home/ros2_ws/balancing_mission_result.json
    max_xy_variance: 0.3
    max_yaw_variance: 0.15
    report_xy_variance: 0.1
    report_yaw_variance: 0.1
    amcl_timeout: 15.0
    nomotion_interval: 5.0
target_localizer:
  ros__parameters:
    target_class: bottle      # exact COCO class name of the target; overridden by launch arg target_class
    confidence: 0.45
    model: /home/ros2_ws/weights/yolo26n.pt
    imgsz: 640
    rate: 3.0                 # Hz, frames processed (newest frame wins)
    image_topic: /image_raw
    camera_info_file: /home/ros2_ws/src/balance_usb_cam/config/camera_info.yaml
    odom_frame: odom_combined
    camera_frame: camera_link # body-style frame (x forward); set optical_frame true for an optical frame
    optical_frame: false
    max_age: 1.0
    ground_z: 0.0             # floor height in map frame (base_footprint is on the floor)
    max_range: 3.0
    confirm_count: 3
    confirm_radius: 0.25
    confirm_window: 8.0
    map_frame: map
velocity_guard:
  ros__parameters:
    hardware_verified: false
    cmd_timeout: 0.4
    heartbeat_timeout: 0.6
    scan_timeout: 0.5
    stop_range: 0.38
    max_v: 0.15
    max_w: 0.3
    acceleration: 0.15
    angular_acceleration: 0.4
    max_invalid_fraction: 0.0
    max_invalid_gap_deg: 0.0
